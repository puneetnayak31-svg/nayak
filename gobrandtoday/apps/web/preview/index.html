<style>

  body { background: #FAFAF7; color: #16161A; }
  [hidden] { display: none !important; }
  .preview-bar { display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: space-between; align-items: center; padding: 8px clamp(16px, 4vw, 40px); background: #16161A; color: #FAFAF7; font-family: 'Manrope', system-ui, sans-serif; font-size: 13px; }
  .preview-bar .btn-link { color: #B9AEFF; }
  .nav { top: env(safe-area-inset-top, 0px); }
