<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width={{W}}, height={{H}}" />
<title>gobrandtoday announcement {{FMT}}</title>
<script src="assets/gsap.min.js"></script>
<style>
{{COMMON_CSS}}
.abs { position: absolute; }
.panel { position: absolute; inset: 0; }
.eyebrow { color: var(--violet-d); font-size: 24px; white-space: nowrap; }
.V .eyebrow { font-size: 22px; }
.hl { font-family: "Space Grotesk", sans-serif; font-weight: 700; letter-spacing: -0.03em; line-height: 1.02; color: var(--graphite); }
.dark .hl, .hl.light { color: var(--paper); }
.sub { font-family: "Manrope", sans-serif; font-weight: 500; color: var(--ink-2); line-height: 1.3; }
.card { position: absolute; background: #FFFFFF; border: 3px solid var(--line); border-radius: 28px; box-shadow: 0 18px 40px rgba(22, 22, 26, 0.08); }
.pill { display: inline-flex; align-items: center; gap: 10px; border-radius: 999px; padding: 8px 18px; font-family: "Space Mono", monospace; font-size: 20px; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
.pill.ex { background: var(--lilac); color: var(--violet-d); }
.marker { display: inline-block; background: var(--violet); color: #FFFFFF; padding: 0 0.14em; border-radius: 0.12em; }
.tile { position: relative; overflow: hidden; border-radius: 22px; flex: none; }
.wk-logo { font-family: "Syne", sans-serif; font-weight: 700; letter-spacing: -0.02em; line-height: 1; white-space: nowrap; display: inline-block; }
.wk-i { position: relative; display: inline-block; }
.wk-flame { position: absolute; width: 0.3em; height: 0.42em; left: calc(50% - 0.15em); top: -0.2em; overflow: visible; transform-origin: 50% 100%; }
.odo { display: inline-flex; line-height: 1; }
.odo .col { display: inline-block; height: 1.3em; line-height: 1.3em; overflow: hidden; vertical-align: top; }
.odo > span { line-height: 1.3em; vertical-align: top; }
.odo .strip { display: block; }
.odo .strip span { display: block; height: 1.3em; line-height: 1.3em; }
.win { position: absolute; background: #FFFFFF; border: 3px solid #CFCAD9; border-radius: 18px; overflow: hidden; box-shadow: 0 16px 34px rgba(22, 22, 26, 0.14); }
.win .bar { height: 42px; background: #F1EFF5; display: flex; align-items: center; gap: 8px; padding: 0 16px; }
.win .bar i { width: 12px; height: 12px; border-radius: 50%; background: #C9C4D6; display: block; }
.win .bar b { margin-left: 8px; font: 600 18px Manrope; color: var(--ink-2); white-space: nowrap; overflow: hidden; }
.win .body { padding: 18px; }
.win .sk { height: 14px; border-radius: 7px; background: #ECE9F2; margin-bottom: 12px; }
.row { position: absolute; display: flex; align-items: center; justify-content: space-between; background: #FFFFFF; border: 3px solid var(--line); border-radius: 20px; padding: 0 26px; }
.status { font-family: "Space Mono", monospace; font-weight: 700; font-size: 20px; letter-spacing: 0.06em; text-transform: uppercase; padding: 8px 14px; border-radius: 12px; white-space: nowrap; }
.st-taken { background: #EDEBF1; color: #4A4756; }
.st-avail { background: #D5F4EF; color: #0A5F57; }
.st-likely { background: var(--lilac); color: var(--violet-d); }
.how { font-family: "Space Mono", monospace; font-size: 17px; color: #5F5B6B; letter-spacing: 0.02em; }
.hud { position: absolute; }
.seg { position: absolute; height: 10px; border-radius: 5px; background: #DCD8E8; overflow: hidden; }
.seg b { position: absolute; inset: 0; background: var(--violet); display: block; transform-origin: 0 50%; }
.lookcard { position: absolute; background: #FFFFFF; border: 3px solid var(--line); border-radius: 28px; overflow: hidden; }
.lookcard .stage { position: absolute; left: 0; top: 0; right: 0; background: #FBFAF8; border-bottom: 3px solid var(--line); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border-radius: 16px; font: 700 24px Manrope; white-space: nowrap; }
.chat { position: absolute; border-radius: 22px; padding: 16px 22px; font: 600 26px Manrope; line-height: 1.25; }
.urlbar { position: absolute; display: flex; align-items: center; gap: 18px; background: var(--paper); border-radius: 999px; padding: 0 30px; box-shadow: 0 0 0 4px rgba(143, 117, 255, 0.35); }
.urlbar .txt { font: 600 44px Manrope; color: var(--graphite); white-space: nowrap; }
.V .urlbar .txt { font-size: 38px; }
.scan { background: repeating-linear-gradient(0deg, rgba(22, 22, 26, 0.10) 0 2px, rgba(22, 22, 26, 0) 2px 6px); }
</style>
</head>
<body>
<div id="root" class="{{FMT}}" data-composition-id="announcement" data-start="0" data-width="{{W}}" data-height="{{H}}" data-duration="38">
  <div class="layer bg-dark" id="bgdark"></div>
  <div class="layer" id="wipes"></div>
  <div class="layer" id="glows"></div>
  <div class="layer field" id="field"></div>
  <section class="clip" id="s-hook" data-start="0" data-duration="3" data-track-index="1"></section>
  <section class="clip" id="s-idea" data-start="3" data-duration="5.05" data-track-index="1"></section>
  <section class="clip" id="s-spark" data-start="8" data-duration="2.55" data-track-index="2"></section>
  <section class="clip" id="s-names" data-start="10" data-duration="4" data-track-index="1"></section>
  <section class="clip" id="s-checks" data-start="14" data-duration="4" data-track-index="1"></section>
  <section class="clip" id="s-score" data-start="18" data-duration="4" data-track-index="1"></section>
  <section class="clip" id="s-looks" data-start="22" data-duration="4.05" data-track-index="1"></section>
  <section class="clip" id="s-book" data-start="26" data-duration="2" data-track-index="1"></section>
  <section class="clip" id="s-launch" data-start="28" data-duration="2.05" data-track-index="1"></section>
  <section class="clip" id="s-close" data-start="30" data-duration="8" data-track-index="1"></section>
  <section class="clip" id="s-hud" data-start="10" data-duration="20" data-track-index="3"></section>
  <div class="layer grain"></div>
  <audio id="music" src="assets/audio/announcement.wav" data-start="0" data-duration="38" data-volume="1"></audio>
</div>
<script>
{{COMMON_JS}}
{{WICKD_JS}}
fontsLoaded().then(() => {
  const W = {{W}}, H = {{H}}, V = H > W;
  const root = document.getElementById("root");
  const tl = gsap.timeline({ paused: true });
  const $ = (id) => document.getElementById(id);

  // Instagram Reels safe area for the vertical cut (text stays out of the header, caption and
  // button zones); title-safe margins for 16:9.
  const SAFE = V ? { x: 90, y: 270, w: 840, h: 1210 } : { x: 120, y: 90, w: 1680, h: 900 };
  const CA = V ? { x: 102, y: 390, w: 816, h: 1090 } : { x: 120, y: 190, w: 1680, h: 800 };   // below the HUD
  const HL = V ? 74 : 82;          // headline size
  const BODY = V ? 30 : 32;

  // ---- cue times, from audio/sound.py ANN
  const C = {
    hook: [0, 0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75], rewind: 2.0, type0: 3.25, step: 0.0625,
    idea: "A cosy candle brand for Gen Z.", tabs: [5.5, 5.625, 5.75, 5.875, 6, 6.125, 6.25, 6.375, 6.5],
    vacuum: 7.5, implode: 8.0, dot: 8.5, diamond: 9.0, spark: 9.5, twin: 10.0,
    names: [10.5, 11.0, 11.5], domains: [14.5, 14.75, 15.0, 15.25], handles: [16, 16.25, 16.5, 16.75, 17, 17.25],
    ring: [18.5, 18.625, 18.75, 18.875, 19, 19.125, 19.25, 19.375], looks: [22, 22.5, 23, 23.5], pick: 24.5,
    book: [26.25, 26.5, 26.75, 27, 27.25, 27.5], launch: [28.25, 28.5, 28.75], chat: [28.95, 29.2],
    close: 30.25, closeText: "Your idea deserves a brand", cdot: 32.0, url: 34.75, enter: 35.875, cta: 36.0, end: 37.0,
  };

  // ---- persistent layers
  const F = buildField($("field"), W, H, V ? 60 : 64, "rgba(109,74,255,0.20)", 0.3, 21);
  fieldIn(tl, F, 0.0, "center", 0.6, 1);

  function wipe(color, at, dur, shape, from) {
    const w = el("div", "", $("wipes"));
    const R = Math.hypot(W, H);
    if (shape === "circle") {
      w.style.cssText = `position:absolute;left:${from[0] - R}px;top:${from[1] - R}px;width:${2 * R}px;height:${2 * R}px;border-radius:50%;background:${color}`;
      appear(tl, w, at, at + dur + 0.05);
      tl.fromTo(w, { scale: 0 }, { scale: 1, duration: dur, ease: "power3.inOut" }, at);
    } else {
      w.style.cssText = `position:absolute;left:0;top:0;width:${W}px;height:${H}px;background:${color}`;
      appear(tl, w, at, at + dur + 0.05);
      tl.fromTo(w, { yPercent: 100 }, { yPercent: 0, duration: dur, ease: "power3.inOut" }, at);
    }
  }
  const toDark = (at) => tl.to("#bgdark", { opacity: 1, duration: 0.001 }, at);
  const toLight = (at) => tl.to("#bgdark", { opacity: 0, duration: 0.001 }, at);
  function glow(at, x, y, size, op, until) {
    const g = el("div", "", $("glows"));
    g.style.cssText = `position:absolute;left:${x - size / 2}px;top:${y - size / 2}px;width:${size}px;height:${size}px;border-radius:50%;background:radial-gradient(closest-side, rgba(109,74,255,0.55), rgba(109,74,255,0))`;
    appear(tl, g, at, until);
    tl.fromTo(g, { opacity: 0, scale: 0.5 }, { opacity: op, scale: 1, duration: 0.6, ease: "sine.out" }, at);
    return g;
  }
  function odo(parent, text, cls = "") {
    const o = el("span", "odo " + cls, parent);
    const cols = [];
    for (const ch of text) {
      if (/[0-9]/.test(ch)) {
        const c = el("span", "col", o), s = el("span", "strip", c);
        for (let d = 0; d <= 9; d++) el("span", "", s, String(d));
        cols.push({ s, d: +ch });
      } else el("span", "", o, ch);
    }
    return { o, cols };
  }
  const roll = (od, at, dur = 0.7) => od.cols.forEach((c, k) =>
    tl.fromTo(c.s, { yPercent: 0 }, { yPercent: -c.d * 10, duration: dur + k * 0.12, ease: "power3.out" }, at));
  function words(parent, text, cls) {
    return text.split(" ").map(w => { const s = el("span", cls || "", parent, w); s.style.display = "inline-block"; s.style.marginRight = "0.24em"; return s; });
  }
  function head(sc, eyebrow, title, opts = {}) {
    const box = el("div", "abs", sc);
    const x = opts.x != null ? opts.x : CA.x, y = opts.y != null ? opts.y : CA.y, w = opts.w || (V ? CA.w : 560);
    Object.assign(box.style, { left: x + "px", top: y + "px", width: w + "px" });
    const e = el("div", "eyebrow mono", box, eyebrow);
    const h = el("div", "hl" + (opts.light ? " light" : ""), box);
    h.style.fontSize = (opts.size || HL) + "px"; h.style.marginTop = "18px";
    const ws = words(h, title);
    return { box, e, h, ws };
  }
  function headIn(hd, at) {
    tl.fromTo(hd.e, { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.45, ease: "power3.out" }, at);
    tl.fromTo(hd.ws, { yPercent: 70, opacity: 0, rotation: V ? 0 : 4 }, { yPercent: 0, opacity: 1, rotation: 0, duration: 0.5, ease: "back.out(1.8)", stagger: 0.06 }, at + 0.05);
  }
  function out(targets, at, dir = -1) {
    if (V) tl.to(targets, { y: -40, opacity: 0, duration: 0.28, ease: "power2.in", stagger: 0.02 }, at);
    else tl.to(targets, { x: dir * 80, opacity: 0, duration: 0.28, ease: "power2.in", stagger: 0.02 }, at);
  }
  function flicker(start, end, seed) {
    const r = rng(seed);
    FLAMES.forEach((f) => {
      let t = start + r() * 0.3;
      while (t < end - 0.3) {
        tl.to(f, { scaleY: 0.9 + r() * 0.25, scaleX: 0.95 + r() * 0.1, skewX: (r() - 0.5) * 10, duration: 0.18 + r() * 0.12, ease: "sine.inOut" }, t);
        t += 0.22 + r() * 0.15;
      }
    });
  }
  function exPill(parent, x, y) {
    const p = el("div", "pill ex abs", parent, "Example");
    Object.assign(p.style, { left: x + "px", top: y + "px" });
    return p;
  }

  // =========================================================== 0-3  HOOK + REWIND
  {
    const sc = $("s-hook");
    const T = V ? { x: SAFE.x + 12, y: SAFE.y + 26, w: SAFE.w - 24, size: 92 } : { x: SAFE.x, y: 260, w: 800, size: 100 };
    const t1 = el("div", "hl abs", sc);
    Object.assign(t1.style, { left: T.x + "px", top: T.y + "px", width: T.w + "px", fontSize: T.size + "px" });
    const w1 = words(t1, "This brand didn't exist");
    const line2 = el("div", "", t1);
    line2.style.marginTop = "14px";
    const mk = el("span", "marker", line2, "5 minutes ago.");
    const cardBox = V ? { x: SAFE.x, y: 720, w: 840, h: 740 } : { x: 960, y: 140, w: 840, h: 800 };
    const card = el("div", "abs", sc);
    Object.assign(card.style, { left: cardBox.x + "px", top: cardBox.y + "px", width: cardBox.w + "px", height: cardBox.h + "px", borderRadius: "36px", overflow: "hidden", boxShadow: "0 30px 60px rgba(22,22,26,0.18)" });
    const makers = [mockLogo, mockJar, mockPost, mockTote, mockApp, mockPalette, mockSign, mockCard];
    const slides = makers.map(fn => { const t = fn(card, cardBox.w, cardBox.h); t.style.position = "absolute"; t.style.left = "0"; t.style.top = "0"; t.style.borderRadius = "0"; return t; });
    const rslides = makers.slice().reverse().map(fn => { const t = fn(card, cardBox.w, cardBox.h); t.style.position = "absolute"; t.style.left = "0"; t.style.top = "0"; t.style.borderRadius = "0"; return t; });
    exPill(card, 28, 28).style.zIndex = 5;
    const tag = el("div", "pill abs", card);
    tag.style.cssText += `;left:auto;right:28px;top:28px;background:${WK.plum};color:${WK.cream};z-index:5`;
    tag.textContent = "Built with gobrandtoday";

    // flashes on every 8th, punch-in each time
    slides.forEach((s, i) => {
      appear(tl, s, C.hook[i], i < 7 ? C.hook[i + 1] : C.rewind);
      tl.fromTo(s, { scale: 1.12 }, { scale: 1, duration: 0.24, ease: "expo.out" }, C.hook[i]);
    });
    tl.fromTo(card, { y: 60, rotation: V ? -2 : 3, opacity: 0 }, { y: 0, rotation: 0, opacity: 1, duration: 0.35, ease: "back.out(1.6)" }, 0.0);
    tl.fromTo(w1, { yPercent: 80, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.25, ease: "back.out(2)", stagger: 0.25 }, 0.0);
    mk.style.transformOrigin = "0% 50%";
    tl.fromTo(mk, { scale: 0.6, opacity: 0, rotation: -4 }, { scale: 1, opacity: 1, rotation: -1.5, duration: 0.35, ease: "back.out(3)" }, 1.0);
    tl.to(t1, { x: (V ? 0 : -6), duration: 0.05, yoyo: true, repeat: 3 }, 1.75);

    // REWIND 2.0-3.0: everything runs backwards fast, scanlines, tracking bars, a timecode
    const scan = el("div", "layer scan", sc);
    appear(tl, scan, C.rewind, 3.0);
    const rw = el("div", "abs", sc);
    rw.style.cssText = `left:0;width:${W}px;top:${V ? SAFE.y + 40 : 120}px;display:flex;justify-content:center;align-items:center;gap:22px;font:700 ${V ? 54 : 64}px "Space Mono";color:var(--graphite);letter-spacing:0.04em`;
    rw.innerHTML = `<svg width="${V ? 70 : 84}" height="${V ? 44 : 52}" viewBox="0 0 84 52"><path d="M42 0 L0 26 L42 52Z M84 0 L42 26 L84 52Z" fill="#6D4AFF"/></svg><span>5 MIN EARLIER</span>`;
    appear(tl, rw, C.rewind, 3.0);
    tl.fromTo(rw, { scale: 1.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: "expo.out" }, C.rewind);
    rslides.forEach((s, i) => appear(tl, s, C.rewind + i * 0.1, i < 7 ? C.rewind + (i + 1) * 0.1 : 2.9));
    tl.to(tag, { opacity: 0, duration: 0.05 }, C.rewind);
    tl.to([t1, card], { skewX: V ? -4 : -8, x: V ? 0 : 40, duration: 0.12, ease: "power2.out" }, C.rewind);
    tl.to(t1, { opacity: 0, duration: 0.001 }, C.rewind + 0.06);
    tl.to(card, { scale: 0.2, opacity: 0, rotation: -25, duration: 0.5, ease: "power3.in" }, C.rewind + 0.4);
    for (let k = 0; k < 3; k++) {
      const b = el("div", "abs", sc);
      b.style.cssText = `left:0;width:${W}px;height:${18 + k * 10}px;background:rgba(255,255,255,0.85);mix-blend-mode:normal`;
      appear(tl, b, C.rewind, 2.95);
      tl.fromTo(b, { y: -60 - k * 200 }, { y: H + 60, duration: 0.45, ease: "none", repeat: 1 }, C.rewind + k * 0.1);
    }
    tl.to(rw, { scaleY: 0.05, opacity: 0, duration: 0.1, ease: "power2.in" }, 2.88);
  }

  // =========================================================== 3-8  ONE SENTENCE, NINE TABS
  let stopPos;
  {
    const sc = $("s-idea");
    const size = V ? 92 : 116;
    const eb = el("div", "eyebrow mono abs", sc, "It starts with one sentence");
    const box = el("div", "hl abs", sc);
    Object.assign(box.style, { left: (V ? SAFE.x : 160) + "px", width: (V ? SAFE.w : 1240) + "px", fontSize: size + "px" });
    const tw_ = typeWords(box, C.idea.slice(0, -1));
    const chars = tw_.chars;
    const stop = el("span", "", tw_.last);
    stop.style.cssText = `display:inline-block;width:0.2em;height:0.2em;border-radius:50%;background:var(--violet);margin-left:0.06em`;
    const caret = el("span", "caret", box);
    const top0 = V ? 760 : 380;
    box.style.top = top0 + "px";
    Object.assign(eb.style, { left: (V ? SAFE.x : 160) + "px", top: (top0 - 70) + "px" });
    const stop0 = posIn(stop, root), bx = V ? SAFE.x : 160;
    const lift = V ? -380 : -250, ls = 0.62;
    stopPos = { cx: bx + (stop0.cx - bx) * ls, cy: top0 + (stop0.cy - top0) * ls + lift };

    tl.fromTo(eb, { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "power3.out" }, 3.0);
    chars.forEach((c, i) => tl.fromTo(c, { display: "none" }, { display: "inline", duration: 0.001 }, C.type0 + i * C.step));
    const tStop = C.type0 + chars.length * C.step + 0.125;
    tl.fromTo(stop, { display: "none" }, { display: "inline-block", duration: 0.001 }, tStop);
    tl.fromTo(stop, { scale: 2.4 }, { scale: 1, duration: 0.35, ease: "elastic.out(1,0.4)" }, tStop);
    [[3.0, 1], [3.12, 0], [C.type0, 1], [tStop, 0], [tStop + 0.25, 1], [5.45, 0]].forEach(([t, o]) => tl.set(caret, { opacity: o }, t));

    // 5.5 the problem: the sentence lifts away, nine tabs flood in, then the full stop swallows them
    tl.to([box, eb], { y: lift, scale: ls, transformOrigin: "0% 0%", duration: 0.45, ease: "power3.inOut" }, 5.4);
    const p = el("div", "hl abs", sc);
    p.style.fontSize = (V ? 84 : 104) + "px";
    Object.assign(p.style, { left: (V ? SAFE.x : 160) + "px", width: (V ? SAFE.w : 1600) + "px", top: (V ? 1180 : 760) + "px", zIndex: 20 });
    const pw = [el("span", "", p, "Usually: "), el("span", "marker", p, "9 tabs."), el("span", "", p, " "), el("span", "marker", p, "3 weekends.")];
    pw.forEach(s => (s.style.display = "inline-block"));
    tl.fromTo(pw, { yPercent: 90, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.3, ease: "back.out(2)", stagger: 0.12 }, 5.55);
    const titles = [["Thesaurus · words for cosy", "thesaurus"], ["Domain search", "domain"], ["Hosting plans", "hosting"],
      ["instagram.com/…", "social"], ["x.com/…", "social"], ["Logo maker · untitled-3", "logo"], ["Google Fonts", "fonts"],
      ["Colour palettes", "colour"], ["Notes · names v7 FINAL", "notes"]];
    const r = rng(4);
    const ww = V ? 270 : 390, wh = V ? 180 : 214;
    const spots = V
      ? [[90, 590], [375, 590], [660, 590], [90, 790], [375, 790], [660, 790], [90, 990], [375, 990], [660, 990]]
      : [[120, 300], [540, 300], [960, 300], [1380, 300], [120, 530], [540, 530], [960, 530], [1380, 530], [1380, 66]];
    const wins = titles.map(([t, kind], k) => {
      const w = el("div", "win", sc);
      Object.assign(w.style, { left: (spots[k][0] - (V ? 0 : 0)) + "px", top: spots[k][1] + "px", width: ww + "px", height: wh + "px", zIndex: 10 + k });
      const bar = el("div", "bar", w); el("i", "", bar); el("i", "", bar); el("i", "", bar); el("b", "", bar, t);
      const body = el("div", "body", w);
      if (kind === "colour") { const row = el("div", "", body); row.style.cssText = "display:flex;gap:8px"; ["#E86A4B", "#F2C14E", "#7AC7A4", "#6C8BE0", "#B57ED6"].forEach(c => { const s = el("i", "", row); s.style.cssText = `display:block;width:${V ? 38 : 56}px;height:${V ? 70 : 90}px;border-radius:10px;background:${c}`; }); }
      else if (kind === "fonts") { const a = el("div", "", body, "Aa Aa"); a.style.cssText = `font:600 ${V ? 48 : 60}px Fraunces;color:#3B3846`; }
      else if (kind === "notes") { ["Cosyco?", "Glowly?", "Wax&Co?"].forEach(n => { const s = el("div", "", body, n); s.style.cssText = `font:600 ${V ? 20 : 24}px Manrope;color:#5F5B6B;text-decoration:line-through;margin-bottom:4px`; }); }
      else for (let q = 0; q < 4; q++) { const s = el("div", "sk", body); s.style.width = (40 + r() * 55) + "%"; }
      return w;
    });
